jobs:

- job: Deploy_Code
  dependsOn: []
  displayName: Code

  steps:

  - checkout: self
    fetchDepth: 1
    fetchTags: false

  - task: AzureResourceManagerTemplateDeployment@3
    displayName: AppServiceSettings.json
    inputs:
      azureResourceManagerConnection: f54f1d6c-d346-41c4-a385-f3b9a579059f
      subscriptionId: 78560c44-50bb-4840-9d59-84578a99032e
      resourceGroupName: tcp-wtf-hosting
      location: Central US
      csmFile: $(Build.SourcesDirectory)/deployment/templates/AppServiceSettings.json
      csmParametersFile: $(Build.SourcesDirectory)/deployment/parameters/Empty.json
      overrideParameters: >-
        -claudeApiKey "$(claude-api-key)"
        -emailChiroBatchMap "$(email-chiro-batch-map)"
        -emailChiroBatchUri "$(email-chiro-batch-uri)"
        -emailServer "$(email-server)"
        -emailPort "$(email-port)"
        -emailUsername "$(email-username)"
        -emailPassword "$(email-password)"
        -googleCredentials "$(google-dr-chiro-credentials)"
        -sqlServerName tompostler
        -sqlAdminPassword "$(tompostler-sqladmin-password)"

  - download: current
    artifact: drop
    displayName: Download drop

  - task: AzureRmWebAppDeployment@4
    displayName: 'App Service Deploy: ns-tcpwtf'
    inputs:
      azureSubscription: f54f1d6c-d346-41c4-a385-f3b9a579059f
      appType: webAppLinux
      WebAppName: ns-tcpwtf
      packageForLinux: '$(Pipeline.Workspace)/drop/number-sequence.zip'
      RuntimeStack: DOTNETCORE|10.0
      StartupCommand: dotnet number-sequence.dll

  - powershell: |
      # nbgv sets Build.BuildNumber to the public version (e.g. "7.7.123"), while the server-version response
      # header carries the full informational version (e.g. "7.7.123+abcde"), so a prefix match is enough and
      # avoids having to re-run nbgv here to compute the expected value independently.
      $expectedVersionPrefix = '$(Build.BuildNumber)';
      $uri = 'https://ns.tcp.wtf/';
      $timeout = New-TimeSpan -Minutes 10;
      $sw = [System.Diagnostics.Stopwatch]::StartNew();
      $actualVersion = $null;
      while ($sw.Elapsed -lt $timeout) {
        try {
          $response = Invoke-WebRequest -Uri $uri -Method Get -TimeoutSec 30;
          $actualVersion = @($response.Headers['server-version'])[0];
          if ($actualVersion -and $actualVersion.StartsWith($expectedVersionPrefix)) {
            Write-Host "Site is serving version '$actualVersion' (expected prefix '$expectedVersionPrefix') after $($sw.Elapsed).";
            exit 0;
          }
          Write-Host "Site is serving version '$actualVersion', waiting for prefix '$expectedVersionPrefix'. Elapsed: $($sw.Elapsed).";
        } catch {
          Write-Host "Request to $uri failed: $($_.Exception.Message)";
        }
        Start-Sleep -Seconds 10;
      }
      Write-Error "Timed out after $timeout waiting for $uri to report version prefix '$expectedVersionPrefix'. Last seen: '$actualVersion'.";
      exit 1;
    displayName: Wait for deployed version to go live

  - powershell: |
      $shortSha = '$(Build.SourceVersion)'.Substring(0, 7);
      $body = @{
        Title = "Deployment of $(Build.DefinitionName) $(Build.BuildNumber)+$shortSha was successful";
        Description = "``$(Build.SourceVersionMessage)``";
      } | ConvertTo-Json -Compress;
      Invoke-RestMethod -Method Post -Uri https://po.tcp.wtf/randommessage -Headers @{ 'x-api-key' = '$(pobot-api-key)' } -ContentType 'application/json' -Body $body;
    displayName: Post deployment message (success)

  - powershell: |
      $shortSha = '$(Build.SourceVersion)'.Substring(0, 7);
      $body = @{
        Title = "Deployment of $(Build.DefinitionName) $(Build.BuildNumber)+$shortSha failed";
        Description = "``$(Build.SourceVersionMessage)``";
      } | ConvertTo-Json -Compress;
      Invoke-RestMethod -Method Post -Uri https://po.tcp.wtf/randommessage -Headers @{ 'x-api-key' = '$(pobot-api-key)' } -ContentType 'application/json' -Body $body;
    condition: failed()
    displayName: Post deployment message (failure)